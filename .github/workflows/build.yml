name: Build & Release Checkers APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/checkers-keystore.jks

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/checkers-keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp android/app/build/outputs/apk/release/app-release.apk "Checkers.apk"
          ls -lh Checkers.apk
          echo "APK=Checkers.apk" >> $GITHUB_ENV
          echo "TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Checkers-APK
          path: ${{ env.APK }}
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Checkers ${{ env.TAG }}
          body: |
            ## Checkers ${{ env.TAG }}

            ### Features
            - Play vs AI (Easy / Medium / Hard), fully offline
            - 2 Player mode on the same device, fully offline
            - Online multiplayer - peer to peer via share code or QR scanning
            - Worldwide rules: UK / Europe (default), US / American, International
            - Configurable per-player timer (3 / 5 / 10 minutes)
            - High Score board - fewest moves & fastest time ranks highest
            - Dark professional theme, works on Samsung S8+ and Pixel 6+
            - Made by jnetai.com

            ### v1.5.0 - The game can never get stuck / hang
            - Fixed: on Hard difficulty (especially on the big International
              board) the AI could search for a very long time, leaving the
              board locked with no way to move or use Hint
            - The AI search now runs inside a node budget, so Hard always
              replies within a couple of seconds no matter how big the board
            - Hint now runs on its own background thread, so tapping Hint is
              always responsive even while the AI is thinking
            - The AI computes on a private copy of the board, so Undo / New
              Game / Resign during the AI's "thinking" no longer leave the
              board locked or replay stale moves - the pending AI reply is
              cancelled automatically
            - Every player turn now explicitly unlocks the board, and a safety
              watchdog force-resolves the AI turn if a reply is ever delayed

            ### v1.4.0 - Clear end-match & chat colours + fixed resign flow
            - Resigning now works properly for BOTH players: whoever resigns is
              no longer left stuck - both sides automatically get the end-of-
              match options (Rematch / Chat / Quit session)
            - If one player asks for a rematch, the other now gets a clear
              Accept / Decline choice, and a new game starts only when both agree
            - If one player chooses Chat, the other's chat screen opens
              automatically so they can talk back straight away
            - The chat screen has Rematch and Quit buttons as well as sending,
              and a "Back" button to return to the end options
            - End-of-match and chat dialogs now use a dark background with
              light-green text (title, message, buttons, chat log, input and
              hints) that is easy to read in any device light/dark mode

            ### v1.3.0 - Instant human moves, AI reply delay + rematch & chat
            - Your own moves are now applied instantly; only the AI delays its
              reply (then glides its piece slowly) so you can see what changed
            - New Settings → "AI reply delay": Instant (0s), 1, 2 or 3 seconds
              of "thinking" time before the AI moves (2 seconds by default)
            - At the end of an online match you can now:
              - Rematch - if both players tap Rematch a new game starts instantly
              - Chat - swap messages with your opponent, with a Rematch button
                built right into the chat
              - Quit session - either player can leave; both return to the
                Multiplayer screen to host / join / Quick Match again

            ### v1.2.2 - Board & piece colours
            - Default piece colours are now RED (Player 1) and BLUE (Player 2)
              so every piece is clearly visible on both the light and dark squares
            - New Colours section in Settings: pick each player's piece colour
              and the dark square colour (board squares otherwise unchanged)
            - Every piece has a light halo rim, so pieces stay visible no matter
              which square colour you choose (no clashing / hidden pieces)
            - In-game labels now say Player 1 / Player 2 instead of Black / White

            ### v1.2.1 - Online board-sync fix
            - Both players now always see both their own and the opponent's
              pieces in every multiplayer mode / connection method
            - Online moves are sent as an authoritative full-board state, so the
              challenger's board always matches the host exactly
            - The challenger adopts the host's rule preset automatically
            - Received moves are no longer echoed back; stale/duplicate states
              are ignored safely

            ### v1.2.0 - Online mode over the internet + realistic AI
            - Online multiplayer now uses WebRTC (PeerJS) over public Google
              STUN + openrelay TURN servers, so opponents connect over the
              internet even behind NAT (fixes the old E-NET-002 connect error)
            - New Quick Match (random) mode - first looks for an existing host,
              otherwise auto-hosts a room, looping until a player is found
            - Share button shortened to "Share" and kept in line with the other
              pairing buttons
            - The AI now "thinks" for a couple of seconds and then glides its
              piece smoothly and slowly across the board so you never miss the move

            ### v1.1.0 - Accurate UK English Draughts
            - Default UK / Europe preset now plays genuine English draughts
            - Non-flying kings (one square, move/capture forwards and backwards)
            - Captures must be on an adjacent square (no gap/flying capture)
            - Compulsory captures, multi-capture, promotion ends the turn
            - No International maximum-capture rule in the default rules

            ### Download
            Grab the APK from the assets below.
          files: |
            ${{ env.APK }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}