plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.jnetai.checkers'
    compileSdk 34

    defaultConfig {
        applicationId "com.jnetai.checkers"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "1.2.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("KEYSTORE_PATH")
            if (keystorePath != null && !keystorePath.isEmpty()) {
                storeFile file(keystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: ""
                keyAlias System.getenv("KEY_ALIAS") ?: ""
                keyPassword System.getenv("KEY_PASSWORD") ?: ""
            } else {
                def localKeystore = file("${rootProject.projectDir}/checkers-keystore.jks")
                if (localKeystore.exists()) {
                    storeFile localKeystore
                    storePassword "4daptBXz0Hp6z8kxcsDhvQVx"
                    keyAlias "checkers"
                    keyPassword "4daptBXz0Hp6z8kxcsDhvQVx"
                } else {
                    def vaultKeystore = file("/home/jay/Documents/Scripts/AI/openclaw/password-vault/ciphervault-release-keystore.jks")
                    if (vaultKeystore.exists()) {
                        storeFile vaultKeystore
                        storePassword "4daptBXz0Hp6z8kxcsDhvQVx"
                        keyAlias "ciphervault"
                        keyPassword "4daptBXz0Hp6z8kxcsDhvQVx"
                    }
                }
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.hasProperty('release') && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            lint {
                abortOnError false
            }
        }
        debug {
            debuggable true
            minifyEnabled false
            if (signingConfigs.hasProperty('release') && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        // Android framework calls (e.g. android.util.Log inside ErrorLogger)
        // are stubbed out with defaults during plain JVM unit tests.
        unitTests.returnDefaultValues = true
    }
    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.8.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // QR code scanning and generation (for online P2P pairing)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.2'

    // Local asset WebView serving + WebRTC transport bridge
    implementation 'androidx.webkit:webkit:1.9.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}